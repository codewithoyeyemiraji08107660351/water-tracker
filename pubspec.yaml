name: water_tracker
description: Drink Water Reminder. Tracks daily water intake and sends scheduled reminder notifications.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.0

  # Local persistence
  sqflite: ^2.4.2
  path: ^1.9.0
  shared_preferences: ^2.5.3

  # Notifications + time zones (required for scheduled reminders)
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.2
  flutter_timezone: ^5.0.1

  # Charts on the History screen
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#4DB6F0"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#4DB6F0"
  image: "assets/splash/splash_logo.png"
  android_12:
    image: "assets/splash/splash_android12.png"
    color: "#4DB6F0"
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: center