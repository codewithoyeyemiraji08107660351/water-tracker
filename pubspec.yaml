name: water_tracker
description: Drink Water Reminder. Tracks daily water intake and sends scheduled reminder notifications.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.0

  # Local persistence
  sqflite: ^2.4.2
  path: ^1.9.0
  shared_preferences: ^2.5.3

  # Notifications + time zones (required for scheduled reminders)
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.2
  flutter_timezone: ^5.0.1

  # Charts on the History screen
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
